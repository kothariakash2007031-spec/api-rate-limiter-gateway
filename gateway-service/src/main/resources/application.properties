spring.application.name=gateway-service
server.port=9090

spring.cloud.gateway.server.webflux.routes[0].id=sample-backend
spring.cloud.gateway.server.webflux.routes[0].uri=${BACKEND_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**

backend.base-url=${BACKEND_URL:http://localhost:8080}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}